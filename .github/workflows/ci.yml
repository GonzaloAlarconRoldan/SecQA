name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Hub & CLI (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check src tests
      - run: mypy src
      - run: pytest --cov=secqa --cov-report=term-missing

  frontend:
    name: Web UI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - name: Committed UI build is up to date
        working-directory: .
        run: |
          git status --porcelain src/secqa/hub/static
          test -z "$(git status --porcelain src/secqa/hub/static)" || {
            echo "::error::src/secqa/hub/static is stale — run 'cd frontend && npm run build' and commit it"; exit 1; }

  k6:
    name: k6 templates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: grafana/setup-k6-action@v1
      - name: Inspect scenario (parses script, profiles and thresholds without sending traffic)
        working-directory: agent-kit/perf
        run: |
          cp endpoints.example.json endpoints.json
          k6 inspect -e BASE_URL=http://127.0.0.1:9 -e PROFILE=load -e VUS=5 -e MAX_VUS=10 scenarios/endpoints.js

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: secqa-hub:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test container
        run: |
          docker run -d --name hub -p 8787:8787 -e SECQA_DEMO_SEED=1 secqa-hub:ci
          for i in $(seq 1 30); do curl -fs http://127.0.0.1:8787/api/health && break; sleep 1; done
          curl -fs "http://127.0.0.1:8787/api/stats/overview?project=JUICE" | python -c "import json,sys; assert json.load(sys.stdin)['kpis']['open_defects'] > 0"
          curl -fs http://127.0.0.1:8787/ | grep -qi '<div id="root"'
          docker logs hub
