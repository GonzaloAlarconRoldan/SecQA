# Dev-only: used to autogenerate new migrations.
#   SECQA_DATA_DIR=.secqa-data alembic revision --autogenerate -m "describe change"
# At runtime the Hub applies migrations itself (secqa.hub.db.upgrade_schema).
[alembic]
script_location = src/secqa/hub/migrations
prepend_sys_path = src

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
